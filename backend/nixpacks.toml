# Add Node.js 22.12+ to the Python environment (clawdbot requirement)
[phases.setup]
nixPkgs = ['nodejs-22_x']

# Install clawdbot after pip installs requirements.txt (Nixpacks auto-handles this)
[phases.postInstall]
cmds = ['bash install_railway.sh']

[start]
cmd = 'uvicorn server:app --host 0.0.0.0 --port $PORT'
